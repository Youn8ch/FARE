rules:
  - id: AREA-OFFICE-CORE-001
    name: 办公区到核心生产区访问复核
    description: 验证 areaId 关系具有方向性
    category: zone_relation
    decision: 待定
    reason_type: policy_violation
    when: {source_area_id: 本部办公区, destination_area_id: 核心生产区}
    semantic_keywords: [办公区, 核心生产区, 方向性]
    evidence_requirements: [source_area_id, destination_area_id]
    reason_template: 办公区到核心生产区的访问需要复核。
    recommendation: 使用受控访问入口或进入正式例外审批。
    remediation_template: 使用受控访问入口并补充审批依据。
  - id: ACL-PATH-001
    name: 未找到途径防火墙
    description: 必需系统规则
    category: least_privilege
    decision: 待定
    reason_type: acl_no_path
    when: {explicit_no_path: true}
    semantic_keywords: [无路径]
    evidence_requirements: [acl_explicit_no_path]
    reason_template: 未找到候选防火墙。
    recommendation: 人工复核。
    remediation_template: 人工复核。

rules:
  - id: MULTI-GENERAL-VM-CORE-DB-001
    name: 通用计算虚拟机到核心数据库多字段访问复核
    description: 验证 area、region、platform 和 usageCode 全部按 AND 精确匹配
    category: zone_relation
    decision: 待定
    reason_type: policy_violation
    when:
      source_area_id: 鳌峰科创生产区
      source_region_name: 鳌峰生产区（通用计算平台）
      source_platform_name: 鳌峰通用计算平台
      source_usage_code: GENERAL_VM
      destination_area_id: 核心生产区
      destination_platform_name: 核心数据库平台
      destination_usage_code: PROD_DATABASE
    semantic_keywords: [通用计算, 核心数据库, 多字段匹配]
    evidence_requirements:
      [source_area_id, source_region_name, source_platform_name, source_usage_code,
       destination_area_id, destination_platform_name, destination_usage_code]
    reason_template: 通用计算虚拟机到核心数据库的访问需要复核。
    recommendation: 核实用途、平台和跨区域访问必要性。
    remediation_template: 按平台和用途拆分申请并补充审批依据。
  - id: ACL-PATH-001
    name: 未找到途径防火墙
    description: 必需系统规则
    category: least_privilege
    decision: 待定
    reason_type: acl_no_path
    when: {explicit_no_path: true}
    semantic_keywords: [无路径]
    evidence_requirements: [acl_explicit_no_path]
    reason_template: 未找到候选防火墙。
    recommendation: 人工复核。
    remediation_template: 人工复核。

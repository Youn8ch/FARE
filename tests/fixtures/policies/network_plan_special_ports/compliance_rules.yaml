rules:
  - id: PORT-SSH-REVIEW-001
    name: SSH 管理端口访问复核
    description: 验证端口范围包含 22 时命中
    category: special_port
    decision: 待定
    reason_type: policy_violation
    when: {protocol: tcp, ports: [22]}
    semantic_keywords: [SSH, 管理端口]
    evidence_requirements: [protocol, destination_port]
    reason_template: TCP/22 管理访问需要复核。
    recommendation: 使用受控运维入口。
    remediation_template: 使用受控运维入口并补充审批依据。
  - id: PORT-TELNET-REVIEW-001
    name: Telnet 管理端口访问复核
    description: 验证端口范围包含 23 时命中
    category: special_port
    decision: 待定
    reason_type: policy_violation
    when: {protocol: tcp, ports: [23]}
    semantic_keywords: [Telnet, 明文管理]
    evidence_requirements: [protocol, destination_port]
    reason_template: TCP/23 Telnet 访问需要复核。
    recommendation: 改用受控加密管理协议。
    remediation_template: 改用 SSH 或进入正式例外审批。
  - id: ACL-PATH-001
    name: 未找到途径防火墙
    description: 必需系统规则
    category: least_privilege
    decision: 待定
    reason_type: acl_no_path
    when: {explicit_no_path: true}
    semantic_keywords: [无路径]
    evidence_requirements: [acl_explicit_no_path]
    reason_template: 未找到候选防火墙。
    recommendation: 人工复核。
    remediation_template: 人工复核。

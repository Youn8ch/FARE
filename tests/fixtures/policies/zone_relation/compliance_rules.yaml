rules:
  - id: ZONE-TEST-001
    name: 办公网不得直接访问生产网
    description: 独立测试夹具中的区域关系规则
    category: zone_relation
    decision: 待定
    reason_type: policy_violation
    when:
      source_zone: office
      destination_zone: production
    semantic_keywords: [办公网, 生产网, 区域隔离]
    evidence_requirements: [source_zone, destination_zone]
    reason_template: 办公网不得直接访问生产网。
    recommendation: 使用受控访问入口或进入例外审批流程。
    remediation_template: 改用受控访问入口或进入正式例外审批。

  - id: ACL-PATH-001
    name: 未找到途径防火墙
    description: ACL API 明确表达没有途径防火墙时进行人工复核
    category: least_privilege
    decision: 待定
    reason_type: acl_no_path
    when:
      explicit_no_path: true
    semantic_keywords: [未找到防火墙, 无路径, 候选路径]
    evidence_requirements: [acl_explicit_no_path]
    reason_template: ACL API 明确表示未找到该访问组合经过的防火墙。
    recommendation: 核实网络目录、候选路径和申请地址后提交人工复核。
    remediation_template: 核实网络目录、候选路径和申请地址后提交人工复核。

rules:
  - id: PLATFORM-CORE-APP-OFFICE-001
    name: 核心应用平台到办公网络访问复核
    description: 验证同一 area 下 platformName 精确匹配和方向性
    category: zone_relation
    decision: 待定
    reason_type: policy_violation
    when: {source_platform_name: 核心应用平台, destination_platform_name: 办公网络}
    semantic_keywords: [核心应用平台, 办公网络, 平台关系]
    evidence_requirements: [source_platform_name, destination_platform_name]
    reason_template: 核心应用平台到办公网络的访问需要复核。
    recommendation: 核实生产到办公方向的业务必要性。
    remediation_template: 使用受控出口并补充审批依据。
  - id: ACL-PATH-001
    name: 未找到途径防火墙
    description: 必需系统规则
    category: least_privilege
    decision: 待定
    reason_type: acl_no_path
    when: {explicit_no_path: true}
    semantic_keywords: [无路径]
    evidence_requirements: [acl_explicit_no_path]
    reason_template: 未找到候选防火墙。
    recommendation: 人工复核。
    remediation_template: 人工复核。

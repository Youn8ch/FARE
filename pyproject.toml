[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fare"
version = "0.2.0"
description = "Firewall Access Request Evaluator"
readme = "README.md"
requires-python = ">=3.13.7,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
  "llm_guard: deterministic output-guard unit tests",
  "llm_pipeline: offline LLM orchestration and fallback tests",
  "llm_http: OpenAI-compatible HTTP boundary contract tests",
  "llm_eval: explicitly selected LLM evaluation tests",
  "network_plan_contract: approved real network planning API contract tests",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

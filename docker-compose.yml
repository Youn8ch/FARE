services:
  fare:
    build: .
    ports:
      - "8000:8000"
    environment:
      ACL_CLIENT_MODE: mock
      ACL_DECISION_MODE: advisory
      ACL_MAX_CONCURRENCY: "8"
      NETWORK_PLAN_CLIENT_MODE: offline_catalog
      NETWORK_PLAN_TIMEOUT_SECONDS: "5"
      NETWORK_PLAN_BATCH_TIMEOUT_SECONDS: "15"
      NETWORK_PLAN_MAX_CONCURRENCY: "8"
      NETWORK_PLAN_MAX_SUBNETS_PER_REQUEST: "64"
      MAX_EVALUATION_ITEMS: "256"
      LLM_CLIENT_MODE: mock
      AUDIT_LOG_RETENTION_DAYS: "30"
      MAX_CONCURRENT_EVALUATIONS: "4"
    volumes:
      - ./policies:/opt/fare/policies:ro
      - fare-audit:/var/lib/fare/audit
    restart: unless-stopped

volumes:
  fare-audit:

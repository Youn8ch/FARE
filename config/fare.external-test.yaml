schema_version: fare-config/v1
config_id: fare-external-test
environment: external-test

server:
  host: 0.0.0.0
  port: 8000
  max_concurrent_evaluations: 4

policy:
  directory: ../policies

requirement_source:
  mode: local
  execution:
    mode: once
    batch_size: 100
    poll_interval_seconds: 30
  local:
    directory: ../inputs/network_requirements
    pattern: "*.json"
    recursive: false
  api: null
  output_file: ../run_results/external-test/network_requirement_results.json

network_plan:
  mode: offline_catalog
  mock:
    fixture: null
  http:
    url: null
    query_parameter: null
    timeout_seconds: 5
    batch_timeout_seconds: 15
    max_concurrency: 8
    auth:
      type: none
      token: null
  cache:
    ttl_seconds: 0
    max_entries: 1024

acl:
  mode: mock
  decision_mode: advisory
  deterministic_pending_mode: skip
  max_concurrency: 8
  mock:
    fixture: null
  http:
    url: null
    timeout_seconds: 10
    auth:
      type: none
      token: null

llm:
  mode: http
  mock:
    fixture: null
  http:
    base_url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4.5-air
    api_key: null
    semantic_timeout_seconds: 180
    explanation_timeout_seconds: 120
    max_correction_retries: 2
    temperature: 0
    max_tokens: 4096
    top_p: 1
    stream: false
    stop: null
    thinking: disabled
  features:
    acl_candidate_mode: shadow
    request_findings_mode: shadow

evaluation:
  max_items: 256
  network_plan_max_subnets: 64
  semantic_effects:
    fact_conflict: review_required
    contradiction: review_required
    temporary_permanent_conflict: review_required
    purpose_target_mismatch: review_required
    mixed_business_context: review_required
    approval_scope_mismatch: review_required
    unclassified_privileged_access: observe_only

audit:
  directory: ../audit_logs/external-test
  retention_days: 30
